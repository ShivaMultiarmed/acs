services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "9999:9999"
      - "${APP_DEBUG_PORT}:${APP_DEBUG_PORT}"
    networks:
      acs-network:
        aliases:
          - acs-app
    depends_on:
      - db
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_SUPER_USERNAME}
      POSTGRES_PASSWORD: ${DB_SUPER_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    networks:
      acs-network:
        aliases:
          - acs-db
    volumes:
      - db_volume:/var/lib/postgresql

networks:
  acs-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.100.0/29
          gateway: 172.16.100.1

volumes:
  db_volume: