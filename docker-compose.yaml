services:
  app:
    build:
      context: .
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "80:9999"
    networks:
      acs-network:
        aliases:
          - acs-app
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    networks:
      acs-network:
        aliases:
          - acs-db
    volumes:
      - db_volume:/var/lib/postgresql/data

networks:
  acs-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.100.0/29
          gateway: 172.16.100.1

volumes:
  db_volume: